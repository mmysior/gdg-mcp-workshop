services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${EMBEDDING_MODEL:-mxbai-embed-large:335m}"]

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      EMBEDDING_API_KEY: ollama
    ports:
      - "8000:8000"

volumes:
  ollama_data:
